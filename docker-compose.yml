services:
  migration:
    build:
      context: ./agent-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "alembic", "upgrade", "head"]
  agent-service:
    build:
      context: ./agent-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MOCK_PLATFORM_URL: ${MOCK_PLATFORM_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
    ports:
      - "8000:8000"
    depends_on:
      migration:
          condition: service_completed_successfully
      mock-platform:
        condition: service_started

  mock-platform:
    build:
      context: ./mock-platform
    environment:
      MOCK_PLATFORM_SCENARIO: ${MOCK_PLATFORM_SCENARIO:-database_pool_exhaustion}
    ports:
      - "8001:8001"
      
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
    - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_commander -d incident_commander"]
      interval: 5s
      timeout: 5s
      retries: 5